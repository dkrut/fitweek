name: Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the image tag, e.g. 1.0.0. Must match the git tag and package.json.'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version }}

      # Loaded into the local daemon first, so a broken image never reaches the registry.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fitweek:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name fitweek-smoke -p 8080:8080 \
            -e SESSION_SECRET=ci-smoke-secret-0123456789abcdef fitweek:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ "${ok:-}" != 1 ]; then docker logs fitweek-smoke; exit 1; fi
          docker rm -f fitweek-smoke

      # Every layer is cached by the step above, so this only uploads them.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
